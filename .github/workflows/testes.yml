# Testes automáticos a cada envio para o GitHub e em cada pull request.
# Não precisa de segredos: os testes simulam o banco e o GitHub.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes de unidade, API e segurança
        run: npm test
      - name: Criador igual ao gerador do servidor
        run: node scripts/sincronizar-criador.js --checar
