<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nova senha | Bio Site</title>
<style>
:root{--cor:#1f4e79;--fundo:#f4f5f8;--texto:#1c2430;--linha:#d6dce5;--suave:#fff;--erro:#b03a2e;--ok:#1e7d4f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--fundo);color:var(--texto);font:15px/1.45 system-ui,sans-serif}
.card{width:100%;max-width:380px;background:var(--suave);border:1px solid var(--linha);border-radius:18px;padding:22px;display:grid;gap:12px}
h1{font-size:22px;margin:0}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
input{font:inherit;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--fundo);color:var(--texto)}
button{font:inherit;font-weight:600;padding:11px 12px;border-radius:10px;border:0;background:var(--cor);color:#fff;cursor:pointer}
.msg{margin:0;font-size:14px;min-height:20px}
.erro{color:var(--erro)}.ok{color:var(--ok)}
a{color:var(--cor);font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <h1>Escolha uma nova senha</h1>
  <form id="form" style="display:grid;gap:12px">
    <label>Nova senha<input type="password" id="senha" required minlength="6" autocomplete="new-password"></label>
    <label>Repita a nova senha<input type="password" id="senha2" required minlength="6" autocomplete="new-password"></label>
    <button type="submit" id="enviar">Salvar senha</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <p id="pronto" hidden><a href="app.html">Ir para o painel</a></p>
</main>
<script src="/conta.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function msg(t, tipo) { $("msg").textContent = t; $("msg").className = "msg " + (tipo || ""); }

  var r = Conta.capturarSessaoDaUrl();
  if (!r && !Conta.ler()) msg("Este link é inválido ou já foi usado. Peça um novo em Esqueci minha senha.", "erro");

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if ($("senha").value !== $("senha2").value) { msg("As senhas não são iguais.", "erro"); return; }
    $("enviar").disabled = true;
    Conta.trocarSenha($("senha").value).then(function () {
      msg("Senha alterada com sucesso.", "ok");
      $("form").hidden = true;
      $("pronto").hidden = false;
    }).catch(function (err) {
      msg(err.message, "erro");
      $("enviar").disabled = false;
    });
  });
})();
</script>
</body>
</html>
